name: بناء APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: قراءة رقم الإصدار وملاحظاته
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # ملاحظات هذا الإصدار من CHANGELOG.md (القسم الأول)
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "📥 رابط ثابت لآخر نسخة: https://github.com/${{ github.repository }}/releases/latest/download/sila.apk" >> notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: نسخ تطبيق الويب داخل أندرويد
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html fonts icons android/app/src/main/assets/

      - name: بناء APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: تسمية الملفات
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sila.apk
          cp sila.apk "sila-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sila-v${{ env.VERSION }}
          path: sila-v${{ env.VERSION }}.apk

      - name: نشر الإصدار في Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: صِلة V${{ env.VERSION }}
          body_path: notes.md
          files: |
            sila.apk
            sila-v${{ env.VERSION }}.apk
          make_latest: true
