plugins {
    id 'com.android.application'
}

// رقم الإصدار يُقرأ من ملف VERSION في جذر المستودع (مثال: 1.1)
def appVersion = rootProject.file("../VERSION").text.trim()
def parts = appVersion.tokenize('.').collect { it.toInteger() }
// 1.1 → 1010 ، 1.2 → 1020 ، 1.10 → 1100 ، 2.0 → 2000
def appVersionCode = parts[0] * 1000 + (parts.size() > 1 ? parts[1] : 0) * 10 + (parts.size() > 2 ? parts[2] : 0)

android {
    namespace 'dz.sila.app'
    compileSdk 35

    defaultConfig {
        applicationId "dz.sila.app"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    // مفتاح توقيع ثابت داخل المستودع: كل نسخة جديدة تُثبَّت فوق القديمة دون حذفها
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
